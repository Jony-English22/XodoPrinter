spring.application.name=xodoprinter
# Solo desarrollo local. No exponer el servidor a la red.
server.address=127.0.0.1
server.port=8082
# Limite didactico temporal: los PRN industriales reales pueden ser mayores.
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=65MB
spring.main.banner-mode=off
server.error.include-message=never
server.error.include-stacktrace=never
